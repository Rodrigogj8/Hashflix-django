<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
        {% endblock %}
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"DM Sans"', 'system-ui', 'sans-serif'],
                    },
                },
            },
        };
    </script>

    {% block head %}
    {% endblock %}
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased pt-20">
    {% include "navbar.html" %}
    {% block content %}
    {% endblock %}
    <script>
    const nav = document.querySelector('nav');

    if (nav) {
        document.addEventListener('scroll', () => {
            if (window.scrollY > window.innerHeight - 100) {
                nav.classList.add('bg-zinc-950/95', 'backdrop-blur-md', 'border-b', 'border-white/10');
            } else {
                nav.classList.remove('bg-zinc-950/95', 'backdrop-blur-md', 'border-b', 'border-white/10');
            }
        });
    }
</script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
