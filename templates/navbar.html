{% load static %}

<nav class="fixed top-0 z-50 w-full border-b border-transparent bg-zinc-950/80 backdrop-blur-md transition-colors duration-300">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3 md:px-6">

        <div class="flex shrink-0 items-center">
            <a href="/" class="block transition-opacity hover:opacity-90">
                <img
                    src="{% static 'images/Hashflix.png' %}"
                    alt="Hashflix"
                    class="h-8 w-auto md:h-10"
                >
            </a>
        </div>

        <div class="flex min-w-0 flex-1 items-center justify-end gap-3 md:gap-4">

            {% if user.is_authenticated %}

                <form
                    method="get"
                    action="{% url 'filme:pesquisafilme' %}"
                    class="flex min-w-0 max-w-[200px] flex-1 justify-end sm:max-w-sm md:max-w-md"
                >
                    <div class="flex w-full overflow-hidden rounded-lg border border-white/15 bg-white/5 shadow-inner">
                        <input
                            type="text"
                            name="query"
                            placeholder="Buscar filmes…"
                            class="min-w-0 flex-1 border-0 bg-transparent px-2 py-2 text-sm text-white placeholder:text-zinc-500 focus:outline-none focus:ring-0 sm:px-3"
                            autocomplete="off"
                        >
                        <button
                            type="submit"
                            class="shrink-0 bg-red-600 px-2 py-2 text-xs font-medium text-white transition hover:bg-red-700 sm:px-4 sm:text-sm"
                        >
                            Buscar
                        </button>
                    </div>
                </form>

                <div class="flex shrink-0 items-center gap-2">
                    <a
                        href="{% url 'filme:editarperfil' request.user.pk %}"
                        class="rounded-lg border border-white/15 bg-white/5 px-3 py-2 text-sm font-medium text-white transition hover:border-white/25 hover:bg-white/10 md:px-4"
                    >
                        Perfil
                    </a>

                    <form method="post" action="{% url 'filme:logout' %}" class="inline">
                        {% csrf_token %}
                        <button
                            type="submit"
                            class="rounded-lg bg-red-600 px-3 py-2 text-sm font-medium text-white transition hover:bg-red-700 md:px-4"
                        >
                            Sair
                        </button>
                    </form>
                </div>

            {% else %}

                <a
                    href="{% url 'filme:login' %}"
                    class="rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-red-700"
                >
                    Entrar
                </a>

            {% endif %}

        </div>
    </div>
</nav>
