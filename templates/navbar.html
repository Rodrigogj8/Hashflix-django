{% load static %}
<nav class="w-full flex items-center justify-between px-6 py-3 bg-black bg-opacity-90 fixed top-0 z-50 shadow-md">

    <!-- Logo -->
    <div class="flex items-center">
        <a href="/">
            <img class="w-32 md:w-44" src="{% static 'images/Hashflix.png' %}" alt="Hashflix Logo">
        </a>
    </div>

    <!-- Área da direita -->
    <div class="flex items-center gap-4">

        {% if user.is_authenticated %}

            <!-- Busca -->
            <form method="get" action="{% url 'filme:pesquisafilme' %}" class="flex items-center bg-white rounded-md overflow-hidden">
                <input 
                    type="text" 
                    name="query" 
                    placeholder="Pesquisar..." 
                    class="px-3 py-1 text-black outline-none w-40 md:w-56"
                >
                <button 
                    type="submit" 
                    class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 transition"
                >
                    Buscar
                </button>
            </form>

            <!-- Botões -->
            <div class="flex items-center gap-2">
                <a href="{% url 'filme:editarperfil' %}" class="bg-red-600 hover:bg-red-700 text-white px-4 py-1 rounded-md transition">
                    Editar Perfil
                </a>

                <form method="post" action="{% url 'filme:logout' %}">
    {% csrf_token %}
    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-4 py-1 rounded-md transition">
        Sair
    </button>
</form>
            </div>

        {% else %}

            <!-- Login -->
            <a href="{% url 'filme:login' %}" class="bg-red-600 hover:bg-red-700 text-white px-5 py-1 rounded-md transition">
                Login
            </a>

        {% endif %}

    </div>

</nav>
