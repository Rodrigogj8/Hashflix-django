{% extends 'base.html' %}
{% load static %}

{% block title %}
Sessão encerrada | Hashflix
{% endblock %}

{% block content %}
<main class="min-h-[calc(100vh-5rem)] bg-zinc-950">
    <div class="relative flex min-h-[calc(100vh-5rem)] items-center justify-center px-4 py-16">
        <div class="absolute inset-0 bg-cover bg-center opacity-30"
             style="background-image: url('{% static 'images/background_netflix.jpg' %}');"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-zinc-950 via-zinc-950/95 to-zinc-950"></div>

        <div class="relative z-10 w-full max-w-md text-center">
            <div class="rounded-2xl border border-white/10 bg-zinc-900/85 p-10 shadow-2xl backdrop-blur-md">
                <h1 class="text-2xl font-semibold tracking-tight text-white">
                    Você saiu da conta
                </h1>
                <p class="mt-3 text-sm text-zinc-400">
                    Obrigado por usar a Hashflix. Volte quando quiser.
                </p>
                <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
                    <a href="{% url 'filme:login' %}"
                       class="inline-flex justify-center rounded-lg bg-red-600 px-6 py-3 text-sm font-semibold text-white transition hover:bg-red-700">
                        Entrar novamente
                    </a>
                    <a href="{% url 'filme:criarconta' %}"
                       class="inline-flex justify-center rounded-lg border border-white/20 bg-white/5 px-6 py-3 text-sm font-semibold text-white transition hover:border-white/30 hover:bg-white/10">
                        Criar conta
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer class="border-t border-zinc-800 px-6 py-8">
        <div class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-3 text-sm text-zinc-500 sm:flex-row">
            <span>&copy; 2026 Hashflix</span>
            <span>Python e Django</span>
        </div>
    </footer>
</main>
{% endblock %}
